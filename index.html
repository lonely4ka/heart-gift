<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lonely4ka+lunasikom Heart ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080711;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      cursor: pointer;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Красивая подсказка на старте */
    .fullscreen-hint {
      position: absolute;
      top: 30px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
      letter-spacing: 2px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 1s ease;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="fullscreen-hint" id="hint">Кликни в любом месте, чтобы открыть во весь экран (Выход — ESC)</div>
  <canvas id="heart"></canvas>

  <script>
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    const phrases = [
      "i love you", "я люблю тебя", "te quiero", "je t'aime", 
      "ich liebe dich", "ti amo", "eu te amo", "我爱你", "사랑해요", "Te iubesc"
    ];

    const centerText = "lonely4ka+lunasikom";
    const APPEAR_TIME = 14;
    const MOVE_TIME = 2.5;

    let points = [];
    let startTime = null;
    let scaleBase = 0;

    function resize() {
      // Холст теперь занимает физически весь экран без образования черных полей
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;

      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

      // Рассчитываем безопасный масштаб: сердце гарантированно не вылезет за экран
      const minDim = Math.min(window.innerWidth, window.innerHeight);
      scaleBase = minDim * 0.31; // Коэффициент уменьшен с 0.34 до 0.31 для запаса по краям

      createHeart();
    }

    function insideHeart(x, y) {
      const a = x*x + y*y - 1;
      return a*a*a - x*x*y*y*y <= 0;
    }

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function createHeart() {
      points = [];
      // Шаг сетки оптимизирован, чтобы на полный экран точек было достаточно и анимация не тормозила
      for (let y = 1.3; y >= -1.25; y -= 0.045) {
        for (let x = -1.35; x <= 1.35; x += 0.045) {
          if (insideHeart(x, y)) {
            points.push({
              x, y,
              startX: random(-2.5, 2.5),
              startY: random(-2.5, 2.5),
              size: random(5, 7),
              delay: Math.random() * 0.65,
              phase: Math.random() * Math.PI * 2,
              text: phrases[Math.floor(Math.random() * phrases.length)]
            });
          }
        }
      }
      points.sort(() => Math.random() - 0.5);
    }

    function ease(t) {
      return t * t * (3 - 2 * t);
    }

    function draw(timestamp) {
      if (startTime === null) startTime = timestamp;

      const elapsed = (timestamp - startTime) / 1000;
      const progress = Math.min(elapsed / APPEAR_TIME, 1);

      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2 + (scaleBase * 0.12); // Смещение центра чуть вниз для компенсации "ушек" сердца

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      const pulse = progress >= 1 ? 1 + Math.sin(elapsed * 2.5) * 0.025 : 1;
      const currentScale = scaleBase * pulse;

      // Мягкий неоновый фон по центру экрана
      const glow = ctx.createRadialGradient(cx, cy, 5, cx, cy, Math.max(window.innerWidth, window.innerHeight) * 0.4);
      glow.addColorStop(0, "rgba(255,20,75,0.15)");
      glow.addColorStop(1, "rgba(255,0,50,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const visibleCount = Math.floor(points.length * progress);

      for (let i = 0; i < visibleCount; i++) {
        const p = points[i];
        const localTime = elapsed - (i / points.length) * APPEAR_TIME;
        const move = ease(Math.max(0, Math.min(1, localTime / MOVE_TIME)));

        // Движение рассчитывается относительно динамического центра экрана
        const x = cx + (p.startX * (1 - move) + p.x * move) * currentScale;
        const y = cy - (p.startY * (1 - move) + p.y * move) * currentScale;

        const fade = Math.min(1, Math.max(0, localTime / 0.35));
        const flicker = 0.8 + 0.2 * Math.sin(elapsed * 2 + p.phase);

        ctx.globalAlpha = fade * flicker;
        ctx.font = `bold ${p.size}px Arial`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ff174f";
        ctx.fillStyle = i % 7 === 0 ? "#ffd1dc" : "#ff315e";

        ctx.fillText(p.text, x, y);
      }

      // Проявление финального текста ровно по центру сердца
      if (progress >= 1) {
        ctx.globalAlpha = Math.min(1, (elapsed - APPEAR_TIME) * 1.5);
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff174f";
        ctx.fillStyle = "#fff0f5";
        
        // Размер текста адаптируется под высоту экрана
        const fontSize = Math.max(24, window.innerHeight * 0.065);
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillText(centerText, cx, cy);
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      requestAnimationFrame(draw);
    }

    // Автоматический запрос на Fullscreen режим браузера по клику
    document.body.addEventListener('click', function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          document.getElementById('hint').style.opacity = '0';
        }).catch(err => {
          console.log("Режим полного экрана заблокирован: " + err.message);
        });
      }
    });

    // Если пользователь закрыл Fullscreen кнопкой ESC, возвращаем подсказку
    document.addEventListener('fullscreenchange', function() {
      if (!document.fullscreenElement) {
        document.getElementById('hint').style.opacity = '1';
      }
    });

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
